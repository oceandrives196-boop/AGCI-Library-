<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGCI Library</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#fafaf8}
.heading-font{font-family:'Playfair Display',serif}
.book-3d{width:100%;aspect-ratio:3/4.2;position:relative}
.book-cover{position:absolute;inset:0;border-radius:3px 10px 10px 3px;display:flex;flex-direction:column;justify-content:space-between;padding:14% 12%;box-shadow:0 10px 20px rgba(0,0,0,0.18)}
.shelf{height:14px;background:linear-gradient(180deg,#c49a6c 0%,#a67c52 50%,#8b5e3c 100%);border-radius:0 0 3px 3px;margin-top:-2px}
</style>
</head>
<body>
<nav class="h-[56px] px-4 flex items-center justify-between bg-white border-b sticky top-0 z-40">
<a href="#" class="flex items-center gap-2.5"><img src="https://i.postimg.cc/59h1DHFV/file-000000000a3071f48c2ca3e54f69a60a.png" class="h-8 w-8 rounded-lg"><span class="heading-font font-bold">AGCI</span></a>
<a href="#" class="w-9 h-9 rounded-full bg-zinc-100 flex items-center justify-center"><i class="fas fa-arrow-left"></i></a>
</nav>

<div class="bg-[#0a0a0e] py-10">
<h1 class="heading-font text-[36px] font-bold text-white text-center">AGCI Library</h1>
<div class="mt-6 max-w-xl mx-auto px-4 relative">
<input id="searchInput" type="text" placeholder="Search books..." class="w-full h-[48px] pl-12 pr-4 rounded-full bg-white text-[14px] focus:outline-none shadow-xl">
<i class="fas fa-search absolute left-8 top-1/2 -translate-y-1/2 text-zinc-400"></i>
</div>
</div>

<section class="max-w-4xl mx-auto px-4 py-12">
<div id="bookGrid" class="grid grid-cols-3 gap-x-4 gap-y-12">

<!-- BIBLE -->
<a href="https://englishbible.agci.org.ng/" data-title="holy bible english new kjv" class="book-item group no-underline">
<div class="book-3d">
<div class="book-cover" style="background:linear-gradient(135deg,#4a2366,#2d0f44)">
<div class="text-center"><div class="text-[8px] tracking-[0.25em] font-bold text-[#E8B94D]">HOLY</div></div>
<div class="text-center"><div class="heading-font font-bold text-white text-[18px]">BIBLE</div><div class="w-6 h-[2px] bg-[#E8B94D] mx-auto mt-2"></div><div class="mt-3 text-white/40 text-[10px]">✝</div></div>
<div class="text-center"><div class="text-[7px] tracking-[0.2em] text-white/60">AGCI • ENGLISH</div></div>
</div>
</div>
<div class="shelf"></div>
<div class="mt-3 text-center"><div class="text-[12px] font-semibold text-zinc-900">Holy Bible</div><div class="text-[10px] text-zinc-500">New KJV • Complete</div></div>
</a>

<!-- CAC HYMN ENGLISH - CORRECT LINK -->
<a href="https://agcihymneng.agci.org.ng/" data-title="cac hymn book english" class="book-item group no-underline">
<div class="book-3d">
<div class="book-cover" style="background:linear-gradient(135deg,#8b0000,#5a0000)">
<div class="text-center"><div class="text-[8px] tracking-[0.25em] font-bold text-[#E8B94D]">CAC</div></div>
<div class="text-center"><div class="heading-font font-bold text-white text-[15px] leading-[0.95]">HYMN<br>BOOK</div><div class="w-6 h-[2px] bg-[#E8B94D] mx-auto mt-2"></div><div class="mt-2 text-[9px] text-white/60">🎵</div></div>
<div class="text-center"><div class="text-[7px] tracking-[0.2em] text-white/60">ENGLISH • 1050</div></div>
</div>
</div>
<div class="shelf"></div>
<div class="mt-3 text-center"><div class="text-[12px] font-semibold text-zinc-900">CAC Hymn Book</div><div class="text-[10px] text-zinc-500">English • 1050 Hymns</div></div>
</a>

</div>
<div id="noResult" class="hidden text-center py-10 text-zinc-500 text-[14px]">No book found</div>
</section>

<script>
const searchInput = document.getElementById('searchInput');
const books = document.querySelectorAll('.book-item');
const noResult = document.getElementById('noResult');
searchInput.addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase().trim();
  let visible = 0;
  books.forEach(book => {
    const title = book.dataset.title;
    if (title.includes(q)) {
      book.classList.remove('hidden');
      visible++;
    } else {
      book.classList.add('hidden');
    }
  });
  noResult.classList.toggle('hidden', visible > 0 || q === '');
});
</script>
</body>
</html>
